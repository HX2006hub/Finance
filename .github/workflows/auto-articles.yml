name: Auto Generate Articles

# ⚠️ 已停用定时自动发布，改为人工节点审核后上线（见 content-draft.yml / publish.yml）。
# 保留此工作流仅供手动补量或调试；它仍然会直接提交到 main，慎用。
# 原本的定时：每天 UTC 0:00（北京时间 8:00）生成 5 篇并直接上线。
on:
  workflow_dispatch: # 仅手动触发

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node generate-articles.js

      - name: Build static article pages
        run: |
          python3 tools/build_static.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles-index.json articles-*.json cards-*.json sitemap.xml articles
          git diff --staged --quiet || git commit -m "Auto-generate articles [skip ci]"
          git push
